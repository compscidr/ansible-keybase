---
- name: Check keybase supports this architecture
  tags: keybase
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      keybase's apt repo only publishes amd64 packages; this host is
      {{ ansible_facts['architecture'] }}.

# apt-key is gone as of Ubuntu 26.04 (apt 3), so ansible.builtin.apt_key no longer
# works. The keybase package ships its own /usr/share/keyrings/keybase.asc and
# /etc/apt/sources.list.d/keybase.list (plain files, overwritten on every install
# or upgrade), so bootstrap exactly those paths and that line. Anything else ends
# up with the repo configured twice once the package is installed.
- name: Remove legacy keybase keyring
  tags: keybase
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    # written by the previous apt_key task
    - /usr/share/keyrings/keybase-archive-keyring.gpg
    - /usr/share/keyrings/keybase-archive-keyring.gpg~

- name: Check for keybase apt key
  tags: keybase
  ansible.builtin.stat:
    path: /usr/share/keyrings/keybase.asc
  register: keybase_apt_key

# https://book.keybase.io/docs/server/our-code-signing-key
# Bootstrap only: once installed, the package owns this file and refreshes it on
# upgrade. Its copy encodes the same key differently from the website's, and
# get_url's If-Modified-Since check would otherwise swap them back and forth.
#
# The repo is plain http, so this key is the whole trust anchor: download it to a
# temp file and only install it once its primary key(s) are exactly the pinned
# fingerprint. A bad download must never reach the real path, since the stat
# gate above would then skip it on every later run.
- name: Bootstrap keybase apt key
  tags: keybase
  become: true
  when: not keybase_apt_key.stat.exists
  block:
    - name: Install gpg (needed to verify the keybase key)
      ansible.builtin.apt:
        name: gpg
        state: present
        update_cache: true

    - name: Create temp file for keybase key
      ansible.builtin.tempfile:
        suffix: .asc
      register: keybase_key_tmp

    - name: Download keybase key
      ansible.builtin.get_url:
        url: https://keybase.io/docs/server_security/code_signing_key.asc
        dest: "{{ keybase_key_tmp.path }}"
        mode: '0644'
        force: true

    - name: Read keybase key primary fingerprints
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          gpg --show-keys --with-colons {{ keybase_key_tmp.path }}
          | awk -F: '/^pub/ {p=1; next} p && /^fpr/ {print $10; p=0}'
        executable: /bin/bash
      register: keybase_key_fingerprints
      changed_when: false

    - name: Verify keybase key fingerprint
      ansible.builtin.assert:
        that: keybase_key_fingerprints.stdout_lines == [keybase_signing_key_fingerprint]
        fail_msg: >-
          Downloaded keybase key has primary fingerprint(s)
          {{ keybase_key_fingerprints.stdout_lines }}, expected only
          {{ keybase_signing_key_fingerprint }}. Not installing it.
        quiet: true

    - name: Install keybase apt key
      ansible.builtin.copy:
        src: "{{ keybase_key_tmp.path }}"
        dest: /usr/share/keyrings/keybase.asc
        remote_src: true
        mode: '0644'
  always:
    - name: Remove temp keybase key
      ansible.builtin.file:
        path: "{{ keybase_key_tmp.path }}"
        state: absent
      when: keybase_key_tmp.path is defined

- name: Install keybase repo
  tags: keybase
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/keybase.list
    content: |
      deb [signed-by=/usr/share/keyrings/keybase.asc] http://prerelease.keybase.io/deb stable main
    mode: '0644'

- name: Install keybase
  tags: keybase
  become: true
  ansible.builtin.apt:
    update_cache: true
    name: keybase
    state: present
